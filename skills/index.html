let data;try{const saved=JSON.parse(localStorage.getItem(key));data=saved?.skills&&saved?.agents?saved:seed();}catch{data=seed();}

function act(label,action,id='',cls='',icon=''){return `<button type="button" class="${cls}" data-act="${action}" ${id?`data-id="${esc(id)}"`:''}>${icon?I(icon):''}${label}</button>`;}
function iconBox(s){return `<div class="skill-icon ${s.color}">${I(s.icon)}</div>`;}
function navItem(label,icon,active=false,action=''){return action?`<button class="nav-item ${active?'active':''}" data-act="${action}">${I(icon)}${label}</button>`:`<div class="nav-item static ${active?'active':''}">${I(icon)}${label}</div>`;}
function shell(){const admin=ui.view==='admin';app.innerHTML=`

function renderMain(){const main=document.getElementById('main');if(ui.detail){renderDetail(main);return;}if(ui.view==='agent'){renderAgent(main);return;}const admin=ui.view==='admin';const official=ui.tab==='platform';main.innerHTML=`<div class="page-heading"><div><h1>${admin?'平台 Skills 管理':'Skill 管理'}</h1><p class="subtitle">${admin?'统一维护官方技能、版本及租户分发范围':'管理组织内 Skill 资产、版本、分类和展示标签'}</p></div><div class="row">${admin?act('管理分类','categories','','soft'):''}${admin||!official?act('创建技能','create','','primary','plus'):''}</div></div>

function filtered(){return data.skills.filter(s=>!s.deleted&&(ui.view==='admin'?s.source==='platform':s.source===ui.tab&&visible(s))&&(!ui.search||(s.name+' '+s.slug).toLowerCase().includes(ui.search.toLowerCase()))&&(ui.category==='all'||s.category===ui.category||(ui.category==='uncategorized'&&!s.category))&&(ui.view!=='admin'||ui.scopeFilter==='all'||(ui.scopeFilter==='global'&&s.scope==='all')||(ui.scopeFilter==='selected'&&s.scope==='selected'&&s.targets.length)||(ui.scopeFilter==='none'&&s.scope!=='all'&&!s.targets.length)));}

function renderDetail(main){const s=skill(ui.detail);if(!s||s.deleted){ui.detail=null;renderMain();return;}const admin=ui.view==='admin',canEdit=admin||s.source==='custom';if(!admin&&!visible(s)){ui.detail=null;renderMain();return;}const tabs=[['content','技能内容'],['versions','版本历史'],['manifest','Manifest']];main.innerHTML=`<div class="back">${act('返回 Skills','back','','link','arrow')}</div><section class="detail-head">${iconBox(s)}<div class="grow"><div class="row wrap title"><h2>${esc(s.name)}</h2><span class="badge ${s.source==='platform'?'blue':'green'}">${sourceLabel(s)}</span>${statusBadge(s)}</div><div class="small muted">${s.latest?'最新版本 '+esc(s.latest)+' · 更新于 '+esc(s.versions.find(v=>v.v===s.latest)?.date):'尚无已发布版本'}</div><div class="skill-id">${esc(s.slug)}</div><div class="metadata"><span>开发者<b>${esc(s.owner)}</b></span><span>分类<b>${esc(s.category||'未分类')}</b></span><span>展示标签<b>${esc(s.tags||'—')}</b></span></div></div><div class="detail-actions">${canEdit?act('编辑','edit',s.id,'soft','edit')+act('上传新版本','upload',s.id,'soft','upload'):''}${admin?act('删除','delete',s.id,'danger','trash'):s.source==='custom'?act('删除','delete',s.id,'danger','trash'):'<span class="badge outline">平台维护 · 只读</span>'}</div></section>

function documentation(s,v){return `<h2>${esc(s.name)}</h2><p>${esc(s.desc)}</p><h3>适用场景</h3><ul><li>${s.slug==='salon-course-search'?'用户要求搜索、查找或浏览 Salon 课程。':s.slug==='popo-doc'?'读取业务文档，提取关键信息并整理内容。':s.slug==='knowledge-search'?'查询企业知识，查找业务资料与制度说明。':'根据业务问题整理资料并生成结构化结果。'}</li><li>在企业工作伙伴对话中，根据用户需求调用相关能力。</li><li>结果提供必要的说明，信息不充分时先向用户确认。</li></ul><h3>使用说明</h3><p>将此 Skill 绑定到 Agent 后使用。相关数据访问仍受当前用户及业务系统权限控制。</p><h3>版本 ${esc(v.v)}</h3><p>${esc(v.note)}</p><pre>name: ${esc(s.slug)}\nversion: ${esc(v.v)}\ndescription: ${esc(s.desc)}</pre>`;}
function renderDetailBody(){const s=skill(ui.detail),admin=ui.view==='admin',edit=admin||s.source==='custom',el=document.getElementById('detail-body');const all=edit?s.versions:published(s),current=s.versions.find(v=>v.v===s.latest);if(ui.detailTab==='content'){el.innerHTML=current?`<article class="docbox">${documentation(s,current)}</article>`:`<div class="docbox empty">${I('upload')}<h3>还没有已发布的技能内容</h3><p>上传 ZIP 版本并发布后，技能内容将在这里展示。</p>${edit?`<div style="margin-top:16px">${act('上传首个版本','upload',s.id,'primary','upload')}</div>`:''}</div>`;}
else if(ui.detailTab==='versions'){el.innerHTML=`<div class="table-shell"><table><thead><tr><th>版本号</th><th>发布时间</th><th>更新说明</th><th>状态</th><th>操作</th></tr></thead><tbody>${all.map(v=>`<tr><td><span class="mono">${esc(v.v)}</span> ${s.latest===v.v?'<span class="badge blue">当前最新</span>':''}</td><td class="muted">${v.status==='draft'?'—':esc(v.date)}</td><td style="white-space:normal;max-width:400px">${esc(v.note)}</td><td><span class="badge ${v.status==='draft'?'orange':'green'}">${v.status==='draft'?'待发布':'已发布'}</span></td><td><div class="actions">${act('查看内容','version-content',s.id+'|'+v.v,'link')}${edit&&v.status==='draft'?act('发布','publish',s.id+'|'+v.v,'link'):''}</div></td></tr>`).join('')}</tbody></table>${!all.length?'<div class="empty">暂无版本，请先上传 ZIP 包。</div>':''}</div>`;}
else if(ui.detailTab==='manifest'){el.innerHTML=current?`<div class="docbox"><div class="small muted">版本 ${esc(current.v)} · Manifest 预览</div><pre>${esc(JSON.stringify({name:s.slug,version:current.v,description:s.desc,files:[{path:s.slug+'/SKILL.md'}],source:s.source==='platform'?'platform':'workspace'},null,2))}</pre></div>`:'<div class="docbox empty">发布版本后可查看 Manifest。</div>';}
}

function agentAvailable(){return data.skills.filter(s=>visible(s)&&s.latest&&!binds().some(b=>b.skill===s.id));}
function agentMatches(s,query){return (s.name+' '+s.slug).toLowerCase().includes((query||'').trim().toLowerCase());}
function renderAgent(main){main.innerHTML=`<div class="back"><span class="row small muted">${I('arrow')}返回 Agents</span></div><div class="agent-heading"><h1>${tenant().name==='EHR'?'员工服务助手':tenant().name+'工作助手'}</h1><p>拥有者：张振 · 来源：工作伙伴</p><div class="skill-id">agent-${ui.tenant}-studio-demo</div></div><div class="tabs agent-primary-tabs"><button class="active">配置</button><span>记忆</span><span>使用</span><span>用量</span></div><div class="subtabs agent-subtabs"><span>基础信息</span><span>内置工具</span><span>Prompt</span><span class="active">Skill</span><span>MCP</span><span>POPO</span></div><p class="agent-instruction">选择要绑定到该 Agent 的 Skills</p><div class="skill-transfer"><section class="transfer-pane" aria-label="可用技能"><div class="transfer-heading">可用 <span id="available-total"></span></div><div class="transfer-search"><input id="agent-available-search" aria-label="搜索可用 Skill" placeholder="搜索 Skill..." value="${esc(ui.availableSearch||'')}"></div><div class="transfer-list" id="agent-available-list"></div><div class="transfer-footer">${act('全选','agent-bind-all','','link')}</div></section><section class="transfer-pane" aria-label="已绑定技能"><div class="transfer-heading">已绑定 <span id="bound-total"></span></div><div class="transfer-search"><input id="agent-bound-search" aria-label="搜索已绑定 Skill" placeholder="搜索 Skill..." value="${esc(ui.boundSearch||'')}"></div><div class="transfer-list" id="agent-bound-list"></div><div class="transfer-footer">${act('清空','agent-clear','','link')}</div></section></div>`;renderAgentLists();}
function renderAgentLists(){const available=agentAvailable(),bound=binds();document.getElementById('available-total').textContent='（'+available.length+'）';document.getElementById('bound-total').textContent='（'+bound.length+'）';const left=available.filter(s=>agentMatches(s,ui.availableSearch));const right=bound.filter(b=>agentMatches(skill(b.skill),ui.boundSearch));document.getElementById('agent-available-list').innerHTML=left.map(s=>`<div class="transfer-item"><button class="transfer-pick" data-act="agent-bind-one" data-id="${esc(s.id)}" aria-label="绑定 ${esc(s.name)}"><span class="transfer-title">${esc(s.name)}</span><span class="transfer-meta"><span>${sourceLabel(s)}</span><span class="mono">v${esc(s.latest)}</span></span></button>${act('绑定','agent-bind-one',s.id,'link transfer-add')}</div>`).join('')||'<div class="transfer-empty">'+(ui.availableSearch?'未找到匹配技能':'暂无可绑定技能')+'</div>';document.getElementById('agent-bound-list').innerHTML=right.map(b=>{const s=skill(b.skill),active=visible(s),update=active&&s.latest!==b.version;return `<div class="transfer-item"><div class="transfer-info"><div class="transfer-title">${esc(s.name)}</div><div class="transfer-meta"><span>${sourceLabel(s)}</span>${act('v'+esc(b.version),'version-content',s.id+'|'+b.version,'link version-link')}${!active?'<span class="withdrawn">'+(s.deleted?'平台已删除':'已停止分发')+'</span>':''}</div></div><div class="transfer-actions">${update?act('升级至 '+esc(s.latest),'upgrade',s.id,'link'):''}${act('解绑','unbind',s.id,'link')}</div></div>`;}).join('')||'<div class="transfer-empty">'+(ui.boundSearch?'未找到匹配技能':'暂无已绑定技能')+'</div>';document.querySelector('[data-act="agent-bind-all"]').disabled=!left.length;document.querySelector('[data-act="agent-clear"]').disabled=!bound.length;}
function bindAgentSkills(id){const selected=id?agentAvailable().filter(s=>s.id===id):agentAvailable().filter(s=>agentMatches(s,ui.availableSearch));if(!selected.length)return;selected.forEach(s=>binds().push({skill:s.id,version:s.latest}));persist();renderAgentLists();toast('已绑定 '+selected.length+' 个技能');}
function clearAgentBindings(){if(!binds().length)return;openDialog('清空已绑定技能',`<p>确认解除当前 Agent 的全部 ${binds().length} 个技能绑定？</p><p class="small muted" style="margin-top:12px">已停止分发或已删除的技能，解绑后无法重新绑定。</p>`,cancel()+'<button class="danger" type="submit">确认清空</button>',{type:'agent-clear'});}
function openDialog(title,body,footer,options={}){modalContext=options;dialog.className='dialog '+(options.drawer?'drawer':'')+(options.wide?' wide':'');dialog.innerHTML=`<form id="modal-form" class="modal-form"><div class="modal-head"><h2>${title}</h2>${act('','close','','icon','close').replace('data-act="close"','aria-label="关闭" data-act="close"')}</div><div class="modal-body">${body}<div id="modal-error" class="error" role="alert" hidden></div></div><div class="modal-footer">${footer}</div></form>`;if(!dialog.open)dialog.showModal();}
const cancel=()=>act('取消','close');
function closeDialog(){dialog.close();modalContext={};}
function error(msg){const e=document.getElementById('modal-error');e.hidden=false;e.textContent=msg;}
function field(label,name,value='',placeholder='',required=false,extra=''){return `<label class="field"><span class="field-label">${required?'<span class="required">*</span>':''}${label}</span><input name="${name}" value="${esc(value)}" placeholder="${placeholder}" ${required?'required':''} ${extra}></label>`;}
function metadataDialog(id){const existing=id?skill(id):null,official=ui.view==='admin';if(existing&&(existing.deleted||existing.source==='platform'&&!official))return;const nameField=field('技能名称','name',existing?.name||'','输入易于理解的技能名称',true,'maxlength="50"');const slugField=field('技能标识'+(official?' <span class="muted small">选填</span>':''),'slug',existing?.slug||'',official?'选填，留空自动生成':'例如 popo-doc',!official,existing?'readonly':'pattern="[a-z0-9][a-z0-9-]*" maxlength="60"');openDialog(existing?'编辑技能':'创建技能',`${official?nameField+slugField:slugField+nameField}<label class="field"><span class="field-label">描述</span><textarea name="desc" placeholder="描述技能的能力与适用场景" maxlength="300">${esc(existing?.desc||'')}</textarea></label>${official?'':field('开发者','owner',existing?.owner||'张振','开发者名称',true)}<label class="field"><span class="field-label"><span class="required">*</span>状态</span><select name="status" required><option value="enabled" ${existing?.status!=='disabled'?'selected':''}>启用</option><option value="disabled" ${existing?.status==='disabled'?'selected':''}>停用</option></select></label><label class="field"><span class="field-label">分类</span><select name="category"><option value="">选择分类</option>${categoriesFor(official).map(c=>`<option value="${esc(c.name)}" ${existing?.category===c.name?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>${official?'':field('展示标签','tags',existing?.tags||'','如：课程')}`,cancel()+`<button class="primary" type="submit">${existing?'保存修改':'创建技能'}</button>`,{type:'metadata',id,official,drawer:true});}
function categoryDialog(){if(ui.view!=='admin')return;openDialog('管理分类','<div id="category-list" class="category-list"></div>'+act('添加分类','category-add','','category-add','plus')+'<div id="category-confirm" hidden></div>',act('关闭','close','','primary'),{type:'categories',editing:null});renderCategories();}
function iconAction(label,action,id,icon,danger=false){return act('',action,id,'icon'+(danger?' danger':''),icon).replace('<button ','<button aria-label="'+esc(label)+'" ');}
function renderCategories(){const editing=modalContext.editing;const rows=[...data.categories];if(editing==='new')rows.push({id:'new',name:'',color:'#8b98ac'});document.getElementById('category-list').innerHTML=rows.map(c=>c.id===editing?`<div class="category-row editing"><input type="color" id="category-color" aria-label="分类颜色" value="${esc(c.color)}"><input type="text" id="category-name" aria-label="分类名称" maxlength="30" placeholder="输入分类名称" value="${esc(c.name)}">${act('保存','category-save',c.id,'link')}${act('取消','category-cancel','','link')}</div>`:`<div class="category-row"><span class="category-dot" style="background:${esc(c.color)}"></span><span class="category-name">${esc(c.name)}</span>${iconAction('编辑分类 '+c.name,'category-edit',c.id,'edit')}${iconAction('删除分类 '+c.name,'category-delete',c.id,'trash',true)}</div>`).join('')||'<div class="category-empty">暂无分类，点击下方添加。</div>';document.getElementById('category-confirm').hidden=true;document.getElementById('modal-error').hidden=true;dialog.querySelector('[data-act="category-add"]').disabled=!!editing;}
function saveCategory(id){const name=document.getElementById('category-name').value.trim(),color=document.getElementById('category-color').value;if(!name){error('请输入分类名称。');return;}if(data.categories.some(c=>c.id!==id&&c.name.toLowerCase()===name.toLowerCase())){error('分类名称已存在。');return;}if(id==='new')data.categories.push({id:'cat-'+Date.now(),name,color});else{const c=data.categories.find(x=>x.id===id);const old=c.name;c.name=name;c.color=color;data.skills.filter(s=>s.source==='platform'&&!s.deleted&&s.category===old).forEach(s=>{s.category=name;touch(s);});if(ui.category===old)ui.category=name;}persist();modalContext.editing=null;renderCategories();renderMain();toast('分类已保存');}
function confirmCategoryDelete(id){const c=data.categories.find(x=>x.id===id),refs=data.skills.filter(s=>s.source==='platform'&&!s.deleted&&s.category===c.name).length;const panel=document.getElementById('category-confirm');panel.className='category-confirm';panel.hidden=false;panel.innerHTML=`<p>删除「${esc(c.name)}」？${refs?'关联的 '+refs+' 个平台技能将变为「未分类」，技能本身不会删除。':'此分类暂无关联技能。'}</p><div class="row">${act('取消','category-delete-cancel')}${act('确认删除分类','category-delete-confirm',id,'danger')}</div>`;}
function deleteCategory(id){const c=data.categories.find(x=>x.id===id);data.skills.filter(s=>s.source==='platform'&&!s.deleted&&s.category===c.name).forEach(s=>{s.category='';touch(s);});if(ui.category===c.name)ui.category='all';data.categories=data.categories.filter(x=>x.id!==id);persist();renderCategories();renderMain();toast('分类已删除');}
function deleteDialog(id){const s=skill(id);if(!s||s.deleted||s.source==='platform'&&ui.view!=='admin')return;const platform=s.source==='platform',refs=Object.values(data.agents).flat().filter(b=>b.skill===id).length;openDialog(platform?'删除平台技能':'删除空间自建技能',`<h3 class="confirm-title">确认删除「${esc(s.name)}」？</h3>${platform?`<p class="small muted">删除后，超管列表和所有已分发租户的「平台提供」列表将同步移除此技能，不能再新增绑定。</p><div class="review-box"><div class="row between"><span>当前分发范围</span><strong>${scopeLabel(s)}</strong></div><div class="row between"><span>已有 Agent 绑定</span><strong>${refs} 个</strong></div></div><div class="notice orange">${I('info')}<span>已有绑定保留历史版本并继续可用；解绑后无法重新绑定。</span></div>`:'<p class="muted small">如仍有 Agent 绑定，需先解绑才可删除。</p>'}`,cancel()+'<button class="danger" type="submit">确认删除</button>',{type:'delete',id});}
function uploadDialog(id){const s=skill(id);if(ui.view!=='admin'&&s.source==='platform')return;openDialog('上传新版本',`<div class="row" style="margin-bottom:22px">${iconBox(s)}<div><h3>${esc(s.name)}</h3><span class="small muted">当前最新：${esc(s.latest||'尚未发布')}</span></div></div><span class="field-label"><span class="required">*</span>技能 ZIP 包</span><div class="dropzone" id="dropzone">${I('upload')}<p class="file-title">选择或拖拽 ZIP 文件到此处</p><p class="help">包含 SKILL.md 的技能包，最大 50 MB</p><input id="zip-input" type="file" accept=".zip,application/zip" aria-label="选择技能 ZIP 包">${act('选择 ZIP 文件','choose-file')}${act('使用示例 ZIP','demo-file','','link')}</div><div id="uploaded-file" class="uploaded" hidden></div><p class="tip" style="margin-bottom:20px">原型仅记录文件名；不会上传文件或执行技能内容。</p>${field('版本号','version','','例如 1.3.0',true,'maxlength="32" pattern="[0-9]+(\\.[0-9]+){1,3}([+-][a-zA-Z0-9.-]+)?"')}<label class="field"><span class="field-label"><span class="required">*</span>更新说明</span><textarea name="note" required maxlength="500" placeholder="说明本次新增能力、修复内容及使用注意事项"></textarea></label><div class="notice">${I('info')}<span>上传后保存为待发布版本，发布前不会影响租户列表或已绑定的 Agent。</span></div>`,cancel()+'<button type="submit" class="primary">保存待发布版本</button>',{type:'upload',id,drawer:true,file:null});}
function scopeDialog(id){const s=skill(id);if(ui.view!=='admin')return;openDialog('管理分发范围',`<div class="row" style="margin-bottom:22px">${iconBox(s)}<div><h3>${esc(s.name)}</h3><span class="small muted">分发最新发布版本 ${esc(s.latest||'（待发布）')}</span></div></div><label class="choice"><input type="radio" name="scope" value="all" ${s.scope==='all'?'checked':''}><span>全部租户<div class="muted">当前及未来新增租户均可查看和新增绑定。</div></span></label><label class="choice"><input type="radio" name="scope" value="selected" ${s.scope!=='all'?'checked':''}><span>指定租户<div class="muted">仅向选定租户提供；取消全部选择可停止新增分发。</div></span></label><div id="tenant-picker" class="tenant-picker" ${s.scope==='all'?'hidden':''}><label class="search">${I('search')}<input id="tenant-search" placeholder="搜索租户名称" aria-label="搜索分发租户"></label>${tenants.map(t=>`<label class="tenant-option" data-name="${t.name}"><input type="checkbox" name="targets" value="${t.id}" ${s.targets.includes(t.id)?'checked':''}><span>${t.name}</span><small>${t.dept}</small></label>`).join('')}</div>${!s.latest?'<p class="tip">尚无已发布版本。范围可先保存，发布首个版本后才会对租户可见。</p>':''}`,cancel()+'<button class="primary" type="submit">保存分发范围</button>',{type:'scope',id,drawer:true});updateScopePicker();}
function updateScopePicker(){const f=document.getElementById('modal-form');document.getElementById('tenant-picker').hidden=f.elements.scope.value==='all';}

function publishDialog(id,v){const s=skill(id),ver=s.versions.find(x=>x.v===v);if(!ver||ver.status!=='draft'||(s.source==='platform'&&ui.view!=='admin'))return;openDialog('发布版本',`<h3 class="confirm-title">将 ${esc(s.name)} 发布为 ${esc(v)}</h3><div class="review-box"><div class="row between"><span>当前最新版本</span><span class="mono">${esc(s.latest||'无')}</span></div><div class="row between"><span>发布后最新版本</span><strong class="mono">${esc(v)}</strong></div><div><span class="muted">更新说明</span><p style="margin-top:5px">${esc(ver.note)}</p></div></div><ul class="rulelist"><li>${s.source==='platform'?'分发范围内的租户列表将同步展示新版。':'当前空间技能列表将展示新版。'}</li><li>已绑定的 Agent 保持原版本，不会自动升级。</li><li>租户可在 Agent 配置中查看更新并手动升级。</li></ul>${s.source==='platform'&&s.scope!=='all'&&!s.targets.length?'<div class="notice orange">当前尚未分发。发布后还需设置分发范围。</div>':''}`,cancel()+'<button class="primary" type="submit">确认发布</button>',{type:'publish',id,version:v});}
function bindingDialog(){const available=data.skills.filter(s=>visible(s)&&s.latest),bound=binds();openDialog('绑定技能',`<div class="notice">${I('info')}<span>可直接选择平台提供或空间自建技能。新增绑定将使用当前最新发布版本，后续不会自动升级。</span></div><div class="toolbar" style="gap:9px;margin:0"><label class="search grow" style="min-width:170px">${I('search')}<input id="bind-search" placeholder="搜索技能名称" aria-label="搜索可绑定技能"></label><select id="bind-source" aria-label="技能来源筛选"><option value="all">全部来源</option><option value="platform">平台提供</option><option value="custom">空间自建</option></select></div><div class="pick-list" id="pick-list">${available.map(s=>{const has=bound.some(b=>b.skill===s.id);return `<label class="pick-row" data-name="${esc(s.name+' '+s.slug)}" data-source="${s.source}"><input type="checkbox" name="skills" value="${s.id}" ${has?'disabled':''}>${iconBox(s)}<div><h3 style="font-size:13px">${esc(s.name)}</h3><div class="small muted" style="margin-top:4px">${esc(s.latest)} · ${esc(s.category||'未分类')}</div><p class="small muted" style="margin-top:4px">${esc(s.desc)}</p></div><span class="source badge ${has?'':'blue'}">${has?'已绑定':sourceLabel(s)}</span></label>`;}).join('')}</div><div id="bind-empty" class="empty" ${available.length?'hidden':''}>暂无可绑定的技能。</div>`,cancel()+'<button class="primary" type="submit">确认绑定<span id="bind-count"></span></button>',{type:'bind',wide:true});}
function upgradeDialog(id){const s=skill(id),b=binds().find(x=>x.skill===id);if(!b||!visible(s)||b.version===s.latest)return;openDialog('升级绑定版本',`<div class="row" style="margin-bottom:18px">${iconBox(s)}<h3>${esc(s.name)}</h3></div><div class="review-box"><div class="row between"><span>当前绑定</span><span class="mono">${esc(b.version)}</span></div><div class="row between"><span>升级至</span><strong class="mono">${esc(s.latest)}</strong></div></div><h3>更新说明</h3><p class="small muted" style="margin-top:8px">${esc(s.versions.find(v=>v.v===s.latest)?.note)}</p><div class="notice orange" style="margin:20px 0 0">${I('info')}<span>仅更新当前 Agent 的绑定。确认后，后续执行使用新版本；其他 Agent 不受影响。</span></div>`,cancel()+'<button class="primary" type="submit">确认升级</button>',{type:'upgrade',id,version:s.latest});}
function unbindDialog(id){const s=skill(id),available=visible(s);openDialog('解除技能绑定',`<p>确认将「${esc(s.name)}」从当前 Agent 中解绑？</p><p class="small muted" style="margin-top:10px">解绑后，当前 Agent 不再使用该技能。</p>${!available?`<div class="notice orange" style="margin-top:20px">${I('info')}<span>此技能已停止向当前租户分发，解绑后无法重新绑定。</span></div>`:''}`,cancel()+'<button class="danger" type="submit">确认解绑</button>',{type:'unbind',id});}
function contentDialog(id,v){const s=skill(id),ver=s?.versions.find(x=>x.v===v);if(!ver)return;const allowed=ui.view==='admin'||visible(s)||binds().some(b=>b.skill===id&&b.version===v);if(!allowed)return;openDialog(`${esc(s.name)} · ${esc(v)}`,`<article class="docbox" style="border:0;padding:0;min-height:0">${documentation(s,ver)}</article>`,act('关闭','close'),{type:'content',wide:true});}
function setFile(file,demo=false){if(!file||!file.name.toLowerCase().endsWith('.zip')){error('请选择 ZIP 格式的技能包。');return;}if(file.size>50*1024*1024){error('技能包大小不能超过 50 MB。');return;}modalContext.file={name:file.name,demo};const el=document.getElementById('uploaded-file');el.hidden=false;el.innerHTML=I('box')+' '+esc(file.name)+(demo?' <span class="badge blue">示例文件</span>':'');document.getElementById('modal-error').hidden=true;}
function filterBinding(){const query=document.getElementById('bind-search').value.toLowerCase(),src=document.getElementById('bind-source').value;let n=0;dialog.querySelectorAll('.pick-row').forEach(el=>{const show=el.dataset.name.toLowerCase().includes(query)&&(src==='all'||el.dataset.source===src);el.hidden=!show;if(show)n++;});document.getElementById('bind-empty').hidden=n>0;}
function now(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;}
function submitModal(e){e.preventDefault();const f=e.target,ctx=modalContext,fd=new FormData(f);if(ctx.type==='metadata'){const name=String(fd.get('name')||'').trim();let slug=String(fd.get('slug')||'').trim();const old=ctx.id?skill(ctx.id):null;const owner=ctx.official?(old?.owner||'WorkHub 官方'):String(fd.get('owner')||'').trim();if(!name||(!ctx.official&&(!slug||!owner))){error(ctx.official?'请填写技能名称。':'请填写技能名称、标识和开发者。');return;}if(!slug)slug='skill-'+Date.now().toString(36);if(data.skills.some(s=>!s.deleted&&s.id!==ctx.id&&s.slug===slug&&(ctx.official?s.source==='platform':s.source==='custom'&&s.tenant===ui.tenant))){error('当前来源下已存在相同技能标识，请换一个标识。');return;}let s=old||{id:'skill-'+Date.now(),source:ctx.official?'platform':'custom',tenant:ctx.official?null:ui.tenant,scope:ctx.official?'selected':'self',targets:[],versions:[],latest:null,icon:'grid',color:ctx.official?'blue':'',createdBy:actor,createdAt:now()};Object.assign(s,{name,slug,owner,status:fd.get('status')==='disabled'?'disabled':'enabled',desc:String(fd.get('desc')||'').trim(),category:fd.get('category')||'',tags:ctx.official?(old?.tags||''):String(fd.get('tags')||'').trim()});touch(s);if(!ctx.id)data.skills.unshift(s);ui.detail=s.id;ui.detailTab='content';persist();closeDialog();shell();toast(ctx.id?'技能信息已更新':'技能已创建，请上传首个版本');}
else if(ctx.type==='upload'){const s=skill(ctx.id),v=String(fd.get('version')).trim(),note=String(fd.get('note')).trim();if(!ctx.file){error('请先选择 ZIP 文件，或使用示例 ZIP。');return;}if(!v||!note){error('请填写版本号和更新说明。');return;}if(s.versions.some(x=>x.v===v)){error('此版本号已存在，请使用新的版本号。');return;}s.versions.unshift({...version(v,now(),note,'draft'),file:ctx.file.name});touch(s);ui.detail=s.id;ui.detailTab='versions';persist();closeDialog();shell();toast('版本已保存为待发布，请确认后发布');}
else if(ctx.type==='scope'){const s=skill(ctx.id);s.scope=fd.get('scope');s.targets=fd.getAll('targets');touch(s);persist();closeDialog();shell();toast('分发范围已更新，已有 Agent 绑定不受影响');}
else if(ctx.type==='publish'){const s=skill(ctx.id),v=s.versions.find(x=>x.v===ctx.version);v.status='published';v.date=now();s.latest=v.v;touch(s);persist();closeDialog();shell();toast('版本已发布，Agent 保持原绑定版本');}
else if(ctx.type==='bind'){const selected=fd.getAll('skills');if(!selected.length){error('请至少选择一个技能。');return;}selected.forEach(id=>{const s=skill(id);if(s&&visible(s)&&s.latest&&!binds().some(b=>b.skill===id))binds().push({skill:id,version:s.latest});});persist();closeDialog();shell();toast('技能已绑定，版本已固定');}
else if(ctx.type==='upgrade'){const s=skill(ctx.id),b=binds().find(x=>x.skill===ctx.id);if(!b||!visible(s)){error('当前技能已不在可分发范围内，暂不可升级。');return;}b.version=ctx.version;persist();closeDialog();shell();toast('当前 Agent 已升级至 '+ctx.version);}
else if(ctx.type==='agent-clear'){data.agents[ui.tenant]=[];persist();closeDialog();shell();toast('已清空当前 Agent 的技能绑定');}
else if(ctx.type==='unbind'){data.agents[ui.tenant]=binds().filter(b=>b.skill!==ctx.id);persist();closeDialog();shell();toast('技能已解绑');}
else if(ctx.type==='delete'){const s=skill(ctx.id),refs=Object.values(data.agents).flat().filter(b=>b.skill===ctx.id);if(s.source==='platform'){s.deleted=true;touch(s);}else{if(refs.length){error('该技能仍有 Agent 绑定，请先解除绑定再删除。');return;}data.skills=data.skills.filter(s=>s.id!==ctx.id);}ui.detail=null;persist();closeDialog();shell();toast(s.source==='platform'?'技能已删除，所有租户列表已同步移除':'空间自建技能已删除');}
else if(ctx.type==='reset'){data=seed();normalize();ui={view:'admin',tenant:'ehr',tab:'platform',detail:null,detailTab:'content',search:'',category:'all',scopeFilter:'all'};persist();closeDialog();shell();toast('演示数据已重置');}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act,id=b.dataset.id;
if(a==='view'){ui.view=id;ui.detail=null;ui.search='';ui.category='all';ui.scopeFilter='all';shell();}
else if(a==='admin-list'||a==='tenant-list'||a==='agent-list'){ui.view=a.split('-')[0];ui.detail=null;ui.search='';shell();}
else if(a==='tab'){ui.tab=id;ui.search='';ui.category='all';renderMain();}
else if(a==='detail'){ui.detail=id;ui.detailTab='content';renderMain();}
else if(a==='back'){ui.detail=null;renderMain();}
else if(a==='detail-tab'){ui.detailTab=id;renderMain();}
else if(a==='create')metadataDialog();else if(a==='edit')metadataDialog(id);else if(a==='upload')uploadDialog(id);else if(a==='scope')scopeDialog(id);else if(a==='close')closeDialog();
else if(a==='publish'){const [s,v]=id.split('|');publishDialog(s,v);}
else if(a==='version-content'){const [s,v]=id.split('|');contentDialog(s,v);}
else if(a==='agent-bind-one')bindAgentSkills(id);else if(a==='agent-bind-all')bindAgentSkills();else if(a==='agent-clear')clearAgentBindings();
else if(a==='bind')bindingDialog();else if(a==='upgrade')upgradeDialog(id);else if(a==='unbind')unbindDialog(id);
else if(a==='choose-file')document.getElementById('zip-input').click();else if(a==='demo-file'){const s=skill(modalContext.id);setFile({name:s.slug+'-demo.zip',size:2048},true);}
else if(a==='delete')deleteDialog(id);
else if(a==='categories')categoryDialog();
else if(a==='category-add'||a==='category-edit'){modalContext.editing=a==='category-add'?'new':id;renderCategories();document.getElementById('category-name').focus();}
else if(a==='category-cancel'){modalContext.editing=null;renderCategories();}
else if(a==='category-save')saveCategory(id);
else if(a==='category-delete')confirmCategoryDelete(id);
else if(a==='category-delete-cancel')document.getElementById('category-confirm').hidden=true;
else if(a==='category-delete-confirm')deleteCategory(id);
else if(a==='reset')openDialog('重置演示数据','<p>清除本地原型中的操作记录，恢复初始技能、分发范围及 Agent 绑定。</p>',cancel()+'<button class="primary" type="submit">重置演示</button>',{type:'reset'});
});
document.addEventListener('change',e=>{if(e.target.id==='tenant-switch'){ui.tenant=e.target.value;ui.detail=null;ui.search='';shell();}else if(e.target.id==='category-filter'){ui.category=e.target.value;renderResults();}else if(e.target.id==='scope-filter'){ui.scopeFilter=e.target.value;renderResults();}else if(e.target.id==='zip-input')setFile(e.target.files[0]);else if(dialog.open&&modalContext.type==='scope'&&['scope','targets'].includes(e.target.name))updateScopePicker();else if(e.target.id==='bind-source')filterBinding();else if(e.target.name==='skills'){const n=dialog.querySelectorAll('[name=skills]:checked').length;document.getElementById('bind-count').textContent=n?'（'+n+'）':'';}});
document.addEventListener('input',e=>{if(e.target.id==='agent-available-search'){ui.availableSearch=e.target.value;renderAgentLists();}else if(e.target.id==='agent-bound-search'){ui.boundSearch=e.target.value;renderAgentLists();}else if(e.target.id==='skill-search'){ui.search=e.target.value;renderResults();}else if(e.target.id==='tenant-search'){dialog.querySelectorAll('.tenant-option').forEach(el=>el.hidden=!el.dataset.name.toLowerCase().includes(e.target.value.toLowerCase()));}else if(e.target.id==='bind-search')filterBinding();});
dialog.addEventListener('submit',e=>{if(modalContext.type==='categories'){e.preventDefault();if(modalContext.editing)saveCategory(modalContext.editing);}else submitModal(e);});dialog.addEventListener('cancel',()=>{modalContext={};});dialog.addEventListener('dragover',e=>{if(e.target.closest('#dropzone'))e.preventDefault();});dialog.addEventListener('drop',e=>{if(e.target.closest('#dropzone')){e.preventDefault();setFile(e.dataTransfer.files[0]);}});
shell();
</script>
</body></html>
